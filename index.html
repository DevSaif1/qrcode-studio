<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Code Studio | مولّد رموز QR مجاني</title>
<meta name="description" content="أنشئ وخصّص رموز QR مجاناً وبدون إعلانات، واقرأ الرموز بالكاميرا أو من صورة.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-glow"></div>

<header class="topbar">
  <div class="brand"><span class="logo-mark">▦</span> QR Code Studio</div>
  <button id="themeBtn" class="icon-btn" aria-label="تبديل الوضع">🌙</button>
</header>

<main class="container">
  <section class="hero">
    <h1>أنشئ رمز QR <span class="grad">بأناقة</span></h1>
    <p>مجاني بالكامل، بدون إعلانات، وكل شيء يعمل داخل متصفحك.</p>
  </section>

  <div class="mode-tabs">
    <button class="mode active" data-mode="generate">توليد رمز</button>
    <button class="mode" data-mode="scan">قراءة رمز</button>
  </div>

  <!-- ===== توليد ===== -->
  <section id="generate" class="panel grid">
    <div class="card controls">
      <div class="seg" id="typeSeg">
        <button class="active" data-type="url">رابط</button>
        <button data-type="text">نص</button>
        <button data-type="wifi">Wi-Fi</button>
      </div>

      <div class="field type-box" id="box-url">
        <label>الرابط</label>
        <input id="urlInput" type="url" dir="ltr" placeholder="https://example.com" value="https://example.com">
      </div>
      <div class="field type-box" id="box-text" hidden>
        <label>النص</label>
        <textarea id="textInput" rows="3" placeholder="اكتب أي نص هنا..."></textarea>
      </div>
      <div class="type-box" id="box-wifi" hidden>
        <div class="field"><label>اسم الشبكة (SSID)</label><input id="ssid" dir="ltr" placeholder="MyWiFi"></div>
        <div class="field"><label>كلمة المرور</label><input id="wpass" dir="ltr" placeholder="••••••••"></div>
        <div class="row">
          <div class="field"><label>نوع التشفير</label>
            <select id="enc"><option value="WPA">WPA/WPA2</option><option value="WEP">WEP</option><option value="nopass">بدون كلمة مرور</option></select>
          </div>
          <label class="check"><input type="checkbox" id="hidden"> شبكة مخفية</label>
        </div>
      </div>

      <button id="genBtn" class="btn primary">توليد الرمز</button>

      <h3>التخصيص</h3>
      <div class="row">
        <div class="field"><label>لون الرمز</label><input type="color" id="fg" value="#6d5dfc"></div>
        <div class="field"><label>لون الخلفية</label><input type="color" id="bg" value="#ffffff"></div>
        <div class="field"><label>الشكل</label>
          <select id="dots"><option value="rounded">مستدير</option><option value="square">مربع</option><option value="dots">نقاط</option><option value="classy-rounded">أنيق</option></select>
        </div>
      </div>
      <div class="field">
        <label>الحجم: <b id="sizeVal">300</b> px</label>
        <input type="range" id="size" min="150" max="500" step="10" value="300">
      </div>
      <div class="field">
        <label>شعار في المنتصف</label>
        <div class="row">
          <label class="btn ghost file-btn">اختر صورة<input type="file" id="logoFile" accept="image/*" hidden></label>
          <button id="rmLogo" class="btn ghost" hidden>إزالة الشعار</button>
        </div>
      </div>
    </div>

    <div class="card preview">
      <div class="qr-frame"><div id="qr"></div></div>
      <div class="actions">
        <button id="dlBtn" class="btn primary">⬇ تنزيل PNG</button>
        <button id="copyImg" class="btn ghost">نسخ كصورة</button>
        <button id="copyTxt" class="btn ghost">نسخ المحتوى</button>
      </div>
      <p class="hint">التنزيل بدقة 1024×1024 بكسل.</p>
    </div>
  </section>

  <!-- ===== قراءة ===== -->
  <section id="scan" class="panel" hidden>
    <div class="card scan-card">
      <div class="row center">
        <label class="btn primary file-btn">📁 رفع صورة QR<input type="file" id="scanFile" accept="image/*" hidden></label>
        <button id="camBtn" class="btn ghost">📷 تشغيل الكاميرا</button>
      </div>
      <div class="video-wrap" id="videoWrap" hidden>
        <video id="video" playsinline muted></video>
        <div class="scan-line"></div>
      </div>
      <canvas id="scanCanvas" hidden></canvas>
      <div class="result" id="result" hidden>
        <label>النتيجة</label>
        <div class="result-text" id="resultText" dir="auto"></div>
        <div class="row">
          <button id="copyRes" class="btn ghost">نسخ</button>
          <button id="openRes" class="btn ghost" target="_blank" rel="noopener" hidden>فتح الرابط</button>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <!-- قسم الشعار وصورتك الشخصية -->
  <div class="footer-images" style="display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 15px;">
    <!-- تعديل اسم الصورة ليطابق اسم الملف الفعلي -->
    <img src="my-photo.jpg.jpeg" alt="صورة المطور سيف الدين جودة" style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary, #6d5dfc);">
    
    <!-- تعديل اسم الشعار ليطابق اسم الملف الفعلي -->
    <img src="university-logo.png.gif" alt="شعار جامعة العلوم الإسلامية العالمية" style="width: 60px; height: 60px; object-fit: contain;">
</div>

<div class="dev" style="text-align: center; margin-bottom: 15px;">
  <p class="dev-name" style="margin: 0 0 5px 0;">تطوير: <b>سيف الدين جودة</b></p>
  <p class="dev-sub" style="margin: 0; font-size: 0.9em; opacity: 0.8;">قسم نظم المعلومات الإدارية (MIS) - جامعة العلوم الإسلامية العالمية</p>
</div>
